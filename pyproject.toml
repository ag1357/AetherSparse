[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aethersparse"
version = "0.15.0"
description = "Operational, persistent, provenance-bound AetherCore edge system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
aethersparse = "aethersparse.cli:app"
aethercore-server = "aethersparse.agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aethersparse"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
# Regression tests import the mission harnesses under scripts/; put the
# repository root on sys.path so `uv run pytest` matches `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aethersparse"]
